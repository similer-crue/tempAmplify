<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AWS Serverless Demo</title>
</head>

<body>

    <h1>🚀 AWS Serverless Demo</h1>

    <p id="message">Click the button to call AWS Lambda.</p>

    <button onclick="callLambda()">
        Call Lambda
    </button>

    <script>
        async function callLambda() {
            try {
                const response = await fetch(
                    "https://b9opg8lst8.execute-api.us-east-1.amazonaws.com/hello"
                );

                const data = await response.json();

                document.getElementById("message").innerText =
                    data.message;

            } catch (error) {
                document.getElementById("message").innerText =
                    "Error calling API: " + error;
            }
        }
    </script>

</body>
</html>
